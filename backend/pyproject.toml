[project]
name = "backend"
version = "0.1.0"
description = "Registro de Vecinos - Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.120.4",
    "sqlalchemy>=2.0.44",
    "psycopg2-binary>=2.9.11",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.1",
    "reportlab>=4.4.5",
    "pypdf2>=3.0.1",
    "pytest>=9.0.2",
]

[dependency-groups]
dev = [
    "pyrefly>=0.40.0",
    "ruff>=0.14.3",
]
